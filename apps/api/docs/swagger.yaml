        maxLength: 10
        type: string
      province:
        example: Jawa Barat
        maxLength: 100
        type: string
    required:
    - address
    - city
    - email
    - name
    - phone
    - province
    type: object
  request.ForgotPasswordRequest:
    properties:
      email:
        example: john@example.com
        type: string
    required:
    - email
    type: object
  request.GoogleLoginRequest:
    properties:
      id_token:
        example: eyJhbGciOiJSUzI1NiIs...
        type: string
    required:
    - id_token
    type: object
  request.InitiatePaymentRequest:
    properties:
      order_id:
        type: string
    required:
    - order_id
    type: object
  request.LoginRequest:
    properties:
      email:
        example: john@example.com
        type: string
      password:
        example: securePass123
        type: string
    required:
    - email
    - password
    type: object
  request.OperatingHourItem:
    properties:
      close_time:
        example: "17:00"
        type: string
      day_of_week:
        example: 1
        maximum: 7
        minimum: 1
        type: integer
      is_closed:
        example: false
        type: boolean
      open_time:
        example: "08:00"
        type: string
    required:
    - close_time
    - day_of_week
    - open_time
    type: object
  request.OrderItemRequest:
    properties:
      equipment_id:
        type: string
      quantity:
        minimum: 1
        type: integer
    required:
    - equipment_id
    - quantity
    type: object
  request.RefreshTokenRequest:
    properties:
      refresh_token:
        example: a1b2c3d4e5f6...
        type: string
    required:
    - refresh_token
    type: object
  request.RegisterRequest:
    properties:
      email:
        example: john@example.com
        maxLength: 255
        type: string
      full_name:
        example: John Doe
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: securePass123
        maxLength: 72
        minLength: 8
        type: string
      phone:
        example: "08123456789"
        maxLength: 20
        minLength: 10
        type: string
      role:
        enum:
        - renter
        - owner
        example: renter
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  request.RejectOrderRequest:
    properties:
      reason:
        maxLength: 500
        minLength: 5
        type: string
    required:
    - reason
    type: object
  request.ResetPasswordRequest:
    properties:
      new_password:
        example: newSecurePass123
        maxLength: 72
        minLength: 8
        type: string
      token:
        example: a1b2c3d4e5f6...
        type: string
    required:
    - new_password
    - token
    type: object
  request.SetOperatingHoursRequest:
    properties:
      hours:
        items:
          $ref: '#/definitions/request.OperatingHourItem'
        type: array
    required:
    - hours
    type: object
  request.SuspendStoreRequest:
    properties:
      reason:
        example: Violation of terms of service
        maxLength: 500
        minLength: 5
        type: string
    required:
    - reason
    type: object
  request.UpdateEquipmentRequest:
    properties:
      brand:
        maxLength: 100
        type: string
      condition:
        enum:
        - new
        - good
        - fair
        - worn
        type: string
      deposit_amount:
        minimum: 0
        type: number
      description:
        maxLength: 5000
        type: string
      is_active:
        type: boolean
      max_rental_days:
        minimum: 1
        type: integer
      min_rental_days:
        minimum: 1
        type: integer
      name:
        example: Updated Equipment Name
        maxLength: 200
        minLength: 3
        type: string
      purchase_date:
        type: string
      total_stock:
        minimum: 0
        type: integer
    type: object
  request.UpdateStoreRequest:
    properties:
      address:
        maxLength: 500
        minLength: 10
        type: string
      banner_url:
        maxLength: 500
        type: string
      city:
        maxLength: 100
        type: string
      description:
        maxLength: 5000
        type: string
      email:
        maxLength: 255
        type: string
      latitude:
        type: number
      logo_url:
        maxLength: 500
        type: string
      longitude:
        type: number
      name:
        example: Updated Store Name
        maxLength: 100
        minLength: 3
        type: string
      phone:
        maxLength: 20
        minLength: 10
        type: string
      postal_code:
        maxLength: 10
        type: string
      province:
        maxLength: 100
        type: string
    type: object
  response.ErrorResponse:
    properties:
      details: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  response.Response:
    properties:
      data: {}
      message:
        type: string
      meta: {}
      success:
        type: boolean
    type: object
  usecase.AuthOutput:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/entity.User'
    type: object
  usecase.AvailabilityOutput:
    properties:
      available:
        type: boolean
      available_qty:
        type: integer
      peak_usage:
        type: integer
      status:
        type: string
      total_stock:
        type: integer
    type: object
  usecase.ForgotPasswordOutput:
    properties:
      message:
        type: string
      reset_token:
        description: In production, token is sent via email. Exposed here for dev/testing
          only.
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Outdoor Equipment Rental Marketplace API
  title: Rent Outdoor API
  version: "1.0"
paths:
  /admin/stores/{id}/approve:
    patch:
      description: Approve a pending store and set it to active.
      parameters:
      - description: Store ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Approve a store (Admin)
      tags:
      - Store Admin
  /admin/stores/{id}/reactivate:
    patch:
      description: Reactivate a previously suspended store.
      parameters:
      - description: Store ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reactivate a suspended store (Admin)
      tags:
      - Store Admin
  /admin/stores/{id}/suspend:
    patch:
      consumes:
      - application/json
      description: Suspend an active store with a reason.
      parameters:
      - description: Store ID
        in: path
        name: id
        required: true
        type: string
      - description: Suspend reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.SuspendStoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Suspend a store (Admin)
      tags:
      - Store Admin
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Send a password reset token for the given email. Does not reveal
        whether email exists.
      parameters:
      - description: Forgot password payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/usecase.ForgotPasswordOutput'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Request password reset
      tags:
      - Auth
  /auth/google:
    post:
      consumes:
      - application/json
      description: Authenticate with Google ID token. Creates account if first login.
      parameters:
      - description: Google login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.GoogleLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/usecase.AuthOutput'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login with Google
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email/password credentials. Returns JWT access
        token and refresh token.
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/usecase.AuthOutput'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login with email and password
      tags:
      - Auth
  /auth/logout:
    post:
      description: Revoke the current session's refresh token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout and revoke session
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid refresh token for a new access token and refresh
        token pair (rotation).
      parameters:
      - description: Refresh token payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/usecase.AuthOutput'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Refresh access token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 'Create a new account with email and password. Roles: renter, owner.'
      parameters:
      - description: Register payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/usecase.AuthOutput'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset password using a valid reset token.
      parameters:
      - description: Reset password payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Reset password
      tags:
      - Auth
  /equipment:
    get:
      description: List equipment with optional filters by store, category, status,
        and search.
      parameters:
      - description: Store ID
        in: query
        name: store_id
        type: string
      - description: Category ID
        in: query
        name: category_id
        type: string
      - description: Filter by status
        enum:
        - available
        - reserved
        - rented
        - maintenance
        - damaged
        - retired
        in: query
        name: status
        type: string
      - description: Search keyword
        in: query
        name: search
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: List equipment
      tags:
      - Equipment
    post:
      consumes:
      - application/json
      description: Create a new equipment item for a store. Only store owners can
        create.
      parameters:
      - description: Equipment payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.CreateEquipmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create new equipment
      tags:
      - Equipment
  /equipment/{id}:
    delete:
      description: Soft delete equipment. Only the store owner can delete.
      parameters:
      - description: Equipment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete equipment (soft)
      tags:
      - Equipment
    get:
      description: Get detailed equipment information including photos, pricing, and
        category.
      parameters:
      - description: Equipment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get equipment by ID
      tags:
      - Equipment
    put:
      consumes:
      - application/json
      description: Update equipment details. Only the store owner can update.
      parameters:
      - description: Equipment ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.UpdateEquipmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update equipment
      tags:
      - Equipment
  /equipment/{id}/availability:
    post:
      consumes:
      - application/json
      description: Check if equipment is available for rental in the given date range
        and quantity.
      parameters:
      - description: Equipment ID
        in: path
        name: id
        required: true
        type: string
      - description: Availability check
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.CheckAvailabilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/usecase.AvailabilityOutput'
