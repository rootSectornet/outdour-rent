        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Check equipment availability for date range
      tags:
      - Equipment
  /equipment/{id}/status:
    patch:
      consumes:
      - application/json
      description: Change equipment status (available, reserved, rented, maintenance,
