      tags:
      - Rentals
  /rentals/{id}/reject:
    patch:
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      - description: Rejection reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.RejectOrderRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Reject an order (store owner)
      tags:
      - Rentals
  /rentals/incoming:
    get:
      parameters:
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List store's incoming orders
      tags:
      - Rentals
  /stores:
    get:
      description: List active stores with optional filters.
      parameters:
      - description: Filter by city
        in: query
        name: city
        type: string
      - description: Filter by province
        in: query
        name: province
        type: string
